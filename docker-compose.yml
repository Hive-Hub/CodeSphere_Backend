version: '3.8'

services:
  web:
    build: .
    container_name: codesphere_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:Sekh%402026@db.fsekrxkesaukfojpeecn.supabase.co:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ONLINE_COMPILER_API_URL=https://api.onlinecompiler.io/v1/execute
      - ONLINE_COMPILER_API_KEY=12ae481e5592e5853e4f544fa0acaa8e
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    restart: always

  celery_worker:
    build: .
    container_name: codesphere_celery
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:Sekh%402026@db.fsekrxkesaukfojpeecn.supabase.co:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    restart: always

  redis:
    image: redis:7-alpine
    container_name: codesphere_redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: codesphere_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=codesphere_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
